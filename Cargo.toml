[package]
name = "locate-anything"
version = "0.1.2"
edition = "2021"
description = "Rust (candle) inference for nvidia/LocateAnything-3B (MoonViT + Qwen2.5 with Parallel Box Decoding)"
license = "Apache-2.0"
repository = "https://github.com/apiplant/locate-anything-rs"
readme = "README.md"
keywords = ["locate-anything","object-detection","grounding","candle","vision"]
categories = ["science","computer-vision","command-line-utilities"]

[lib]
name = "locate_anything"
path = "src/lib.rs"

[[bin]]
name = "locate-anything"
path = "src/main.rs"

[features]
default = []
# GPU support is opt-in, so depending on this crate never pulls in a CUDA toolchain: enable it from your
# own Cargo.toml with `features = ["cuda"]`.
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# FlashAttention-2 kernels for the vision tower and LM prefill (long first build).
flash-attn = ["cuda", "dep:candle-flash-attn"]

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-flash-attn = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
